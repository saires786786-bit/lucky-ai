<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucky AI - Saires</title>
<style>
*{margin:0;box-sizing:border-box}body{font-family:system-ui;background:#0f0f0f;color:#fff;height:100dvh;display:flex;flex-direction:column}#h{background:#000;padding:14px;text-align:center;font-weight:bold;border-bottom:1px solid #222}#c{flex:1;overflow:auto;padding:12px;display:flex;flex-direction:column;gap:12px;padding-bottom:90px}.m{padding:12px 16px;border-radius:18px;max-width:85%;line-height:1.5}.u{background:#0084ff;align-self:flex-end}.a{background:#1e1e1e;align-self:flex-start;border:1px solid #333}#b{position:fixed;bottom:0;left:0;right:0;display:flex;padding:10px;background:#000;gap:8px;border-top:1px solid #222}#i{flex:1;border:1px solid #333;border-radius:25px;padding:12px 18px;background:#222;color:#fff;outline:none}#s{background:#0084ff;color:#fff;border:none;border-radius:25px;padding:12px 20px;font-weight:bold}
</style>
</head>
<body>
<div id="h">Lucky AI 🤖 - Saires Khan</div>
<div id="c"><div class="m a">Assalam o Alaikum! Lucky AI ready hai. Bolo kya help chahiye?</div></div>
<div id="b"><input id="i" placeholder="Kuch likho..."><button id="s">Send</button></div>
<script>
const API_KEY = "YAHAN_APNI_API_KEY_DALO";
const c=document.getElementById('c'),inp=document.getElementById('i'),btn=document.getElementById('s');
function add(t,cls){let d=document.createElement('div');d.className='m '+cls;d.textContent=t;c.appendChild(d);c.scrollTop=c.scrollHeight}
async function ask(q){add(q,'u');inp.value='';try{let r=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:q}]}]})});let j=await r.json();let ans=j.candidates?.[0]?.content?.parts?.[0]?.text||"Bhai API Key galat hai, check karo";add(ans,'a')}catch(e){add("Error: API Key galat hai ya net slow hai",'a')}}
btn.onclick=()=>{if(inp.value.trim())ask(inp.value.trim())};inp.onkeydown=e=>{if(e.key==='Enter'&&inp.value.trim())ask(inp.value.trim())}
</script>
</body>
</html>
