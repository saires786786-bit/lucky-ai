<!doctype html><html><head><meta charset="utf-8"><meta name=viewport content='width=device-width'><title>Lucky AI</title><script src="https://js.puter.com/v2/"></script><style>body{background:#0f172a;color:#fff;font-family:sans-serif;display:flex;justify-content:center;padding:15px}div{width:100%;max-width:500px}#c{height:70vh;overflow:auto;background:#fff;color:#000;padding:10px;border-radius:12px}p{padding:10px;border-radius:10px;margin:6px;word-wrap:break-word}.u{background:#22c55e;color:#fff;text-align:right}.a{background:#f1f5f9;color:#000}</style></head><body><div><h2 style=text-align:center>Lucky AI - All Languages</h2><div id=c><p class=a>Salam bhai! Kisi bhi zaban me bat karo, me usi me jawab dunga!</p></div><br><div style=display:flex;gap:6px><input id=i style=flex:1;padding:14px;border-radius:25px;border:0 placeholder="Yahan likho..."><button onclick=s() style=padding:14px 20px;border-radius:10px;border:0;background:#22c55e;color:#fff;font-weight:bold>Send</button></div></div><script>async function s(){let q=document.getElementById('i').value.trim();if(!q)return;let c=document.getElementById('c');c.innerHTML+=`<p class=u>${q}</p>`;document.getElementById('i').value='';let d=document.createElement('p');d.className='a';d.innerText='Lucky soch raha hai...';c.appendChild(d);c.scrollTop=c.scrollHeight;try{let prompt=`You are Lucky AI. Reply in SAME language and script user used. User said: ${q}. If Roman Urdu -> Roman Urdu, Pashto -> Pashto, Saraiki -> Saraiki, Urdu -> Urdu, English -> English.`;let r=await puter.ai.chat(prompt,{model:"claude-3-5-sonnet"});d.innerText=r.message.content[0].text||r; }catch(e){try{let r2=await puter.ai.chat(q);d.innerText=r2.message.content[0].text||r2;}catch(e2){d.innerText="Error: "+e2.message;}}c.scrollTop=c.scrollHeight;}document.getElementById('i').addEventListener('keypress',function(e){if(e.key==='Enter')s();});</script></body></html>
