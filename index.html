<!DOCTYPE html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucky</title>
<style>
*{margin:0;box-sizing:border-box}
body{font-family:system-ui;height:100dvh;display:flex;flex-direction:column;background:#efe7dd}
#h{background:#075e54;color:#fff;padding:12px;text-align:center;font-weight:bold}
#c{flex:1;overflow:auto;padding:10px;padding-bottom:80px;display:flex;flex-direction:column;gap:6px}
.m{padding:9px 12px;border-radius:14px;max-width:85%;font-size:14px;white-space:pre-wrap}
.u{background:#dcf8c6;align-self:flex-end}
.a{background:#fff;align-self:flex-start}
#b{position:fixed;bottom:0;left:0;right:0;display:flex;gap:6px;padding:6px;background:#f0f0f0}
#i{flex:1;border:0;border-radius:20px;padding:10px 14px;outline:0}
#s{border:0;background:#25d366;color:#fff;width:44px;height:44px;border-radius:50%}
</style></head>
<body>
<div id="h">Lucky AI</div>
<div id="c"></div>
<div id="b"><input id="i" placeholder="Sawal..."><button id="s">></button></div>
<script>
let c=document.getElementById('c');
let i=document.getElementById('i');
let s=document.getElementById('s');
function M(t,k){
let d=document.createElement('div');
d.className='m '+k;
d.textContent=t;
c.appendChild(d);
c.scrollTop=9e9;
return d;
}
async function Q(q){
let u="https://text.pollinations.ai/";
u+=encodeURIComponent(q);
u+="?model=openai&system=";
let y="Lucky AI by Saires.Roman Urdu.";
u+=encodeURIComponent(y);
let r=await fetch(u);
return await r.text();
}
async function SND(){
let q=i.value.trim();
if(!q)return;
M(q,'u');
i.value='';
let m=M("...","a");
try{
let a=await Q(q);
m.textContent=a;
}catch(e){
let e1="Net slow, phir bolo";
m.textContent=e1;
}
}
s.onclick=SND;
i.onkeydown=e=>{
if(e.key=='Enter')SND();
};
M("Salam! Main Lucky hun","a");
</script></body></html>
