<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucky AI</title><style>*{box-sizing:border-box;margin:0}body{height:100dvh;display:flex;flex-direction:column;background:#efe7dd;font-family:system-ui}#h{padding:12px;background:#075e54;color:#fff;text-align:center;font-weight:bold}#C{flex:1;overflow:auto;padding:12px 12px 90px;display:flex;flex-direction:column;gap:8px}.m{padding:10px 14px;border-radius:18px;max-width:85%;white-space:pre-wrap}.u{background:#dcf8c6;align-self:flex-end}.a{background:#fff;align-self:flex-start}.B{position:fixed;bottom:0;left:0;right:0;background:#f0f0f0;padding:8px;display:flex;gap:6px}.pill{flex:1;background:#fff;border-radius:28px;display:flex;align-items:center;padding:5px 10px}.pill input{flex:1;border:0;outline:0;padding:8px}.icon{font-size:20px;cursor:pointer}#S{width:44px;height:44px;border-radius:50%;border:0;background:#25d366;color:#fff;font-size:20px}</style></head><body><div id="h">🍀 Lucky AI - Saires Mumtaz Qureshi</div><div id="C"><div class="m a">Salam bhai! Main pori duniya janta hoon, poocho!</div></div><div class="B"><div class="pill"><span class="icon" onclick="cam.click()">📷</span><span class="icon" onclick="gal.click()">🖼️</span><input id="I" placeholder="Sawal likho..."></div><button id="S">➤</button></div><input type="file" id="cam" accept="image/*" capture="environment" style="display:none"><input type="file" id="gal" accept="image/*" style="display:none"><script>
let C=document.getElementById('C'),I=document.getElementById('I'),S=document.getElementById('S'),cam=document.getElementById('cam'),gal=document.getElementById('gal');

async function SD(){let q=I.value.trim();if(!q)return;AD(q,'u');I.value='';let m=AD('...','a');if(q.toLowerCase().includes('kis')&&q.toLowerCase().includes('bna')){m.textContent='Mujhe Saires Mumtaz Qureshi ne banaya hai! 🍀';return}try{let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(q+' answer in Roman Urdu short, you are Lucky AI by Saires Mumtaz Qureshi, know whole world'));let t=await r.text();m.textContent=t.replace(/OpenAI|ChatGPT/gi,'Lucky AI')}catch(e){m.textContent='Network slow hai bhai, dubara bhejo!'}}S.onclick=SD;I.onkeydown=e=>{if(e.key==='Enter')SD()};
