<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width"><title>Lucky AI</title><style>body{background:#0f172a;color:#fff;font-family:sans-serif;display:flex;justify-content:center;padding:15px}div{width:100%;max-width:500px}#c{height:70vh;overflow:auto;background:#fff;color:#000;padding:10px;border-radius:12px}p{padding:10px;border-radius:10px;margin:6px}.u{background:#22c55e;color:#fff;text-align:right}.a{background:#f1f5f9}</style></head><body><div><h2 style=text-align:center>Lucky AI</h2><div id=c><p class=a>Salam bhai! Bolo kya haal hai?</p></div><br><div style=display:flex;gap:6px><input id=i style=flex:1;padding:12px;border-radius:20px;border:0 placeholder="Yahan likho..."><button onclick=s() style=padding:12px 18px;border-radius:10px;border:0;background:#22c55e;color:#fff>Send</button></div></div><script>async function s(){let q=document.getElementById('i').value.trim();if(!q)return;let c=document.getElementById('c');c.innerHTML+=`<p class=u>${q}</p>`;document.getElementById('i').value='';let d=document.createElement('p');d.className='a';d.innerText='...';c.appendChild(d);c.scrollTop=c.scrollHeight;try{let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(q)+'?model=openai&system='+encodeURIComponent('You reply in same language as user.'));let t=await r.text();d.innerText=t;}catch(e){d.innerText='Bhai thora net slow hai, dobara bhejo: '+q}c.scrollTop=c.scrollHeight}</script></body></html>
