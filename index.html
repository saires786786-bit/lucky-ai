<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucky AI - Saires Mumtaz</title>
<style>
*{box-sizing:border-box;margin:0}body{height:100dvh;display:flex;flex-direction:column;background:#efe7dd;font-family:system-ui}
#h{padding:14px;background:#075e54;color:#fff;text-align:center;font-weight:bold}
#C{flex:1;overflow:auto;padding:14px 14px 90px;display:flex;flex-direction:column;gap:10px}
.m{padding:11px 15px;border-radius:18px;max-width:86%;font-size:15px;white-space:pre-wrap;line-height:1.4}
.u{background:#dcf8c6;align-self:flex-end}.a{background:#fff;align-self:flex-start}
.B{position:fixed;bottom:0;left:0;right:0;background:#f0f0f0;padding:8px;display:flex;gap:6px}
.pill{flex:1;background:#fff;border-radius:28px;display:flex;align-items:center;padding:5px 12px}
.pill input{flex:1;border:0;outline:0;font-size:16px;padding:8px}
.icon{font-size:22px;cursor:pointer;padding:4px}
#S{width:46px;height:46px;border-radius:50%;border:0;background:#25d366;color:#fff;font-size:22px;display:grid;place-items:center}
img.chat-img{max-width:200px;border-radius:12px;margin-top:6px}
</style>
</head>
<body>
<div id="h">🍀 Lucky AI - Saires Mumtaz Qureshi</div>
<div id="C"><div class="m a">Salam Saires bhai! 🍀 Main Lucky AI hoon! Pori duniya janta hoon, koi bhi sawal poocho!</div></div>
<div class="B">
<div class="pill">
<span class="icon" onclick="document.getElementById('cam').click()">📷</span>
<span class="icon" onclick="document.getElementById('gal').click()">🖼️</span>
<input id="I" placeholder="Koi bhi sawal poocho...">
</div>
<button id="S">➤</button>
</div>
<input type="file" id="cam" accept="image/*" capture="environment" style="display:none">
<input type="file" id="gal" accept="image/*" style="display:none">
<script>
const C=document.getElementById('C'), I=document.getElementById('I'), S=document.getElementById('S');
const cam=document.getElementById('cam'), gal=document.getElementById('gal');
function AD(t,k){let d=document.createElement('div');d.className='m '+k;d.textContent=t;C.appendChild(d);C.scrollTop=C.scrollHeight;return d}
function addImg(src){let d=document.createElement('div');d.className='m u';d.innerHTML=`Ye dekho bhai:<br><img src="${src}" class="chat-img">`;C.appendChild(d);C.scrollTop=C.scrollHeight;}
function handleFile(f){let r=new FileReader();r.onload=e=>{addImg(e.target.result);AD('MashAllah pyari pic hai bhai jan! 🍀 Bolo iska kya karna hai?','a');};r.readAsDataURL(f);}
cam.addEventListener('change',()=>{if(cam.files[0])handleFile(cam.files[0])});
gal.addEventListener('change',()=>{if(gal.files[0])handleFile(gal.files[0])});
async function askAI(q){
let system=`You are Lucky AI created by Saires Mumtaz Qureshi from Jeddah. You know EVERYTHING of whole world - Islam, history, geography, science, capitals, current affairs. Reply ONLY in Roman Urdu, short friendly WhatsApp style like "Haan bhai jan". Never ask for details, always answer directly. Never say you are ChatGPT.`;
try{
let res=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'openai',messages:[{role:'system',content:system},{role:'user',content:q}],max_tokens:600})});
let data=await res.json();
let ans=data.choices?.[0]?.message?.content;
if(ans && ans.length>3) return ans;
throw 'fallback';
}catch(e){
let r2=await fetch('https://text.pollinations.ai/'+encodeURIComponent(q+' answer in Roman Urdu short'));
return await r2.text();
}
}
async function SD(){
let q=I.value.trim();if(!q)return;AD(q,'u');I.value='';
let m=AD('Lucky soch raha hai...','a');
let low=q.toLowerCase();
if((low.includes('kis')&&low.includes('bna'))||low.includes('kisne')){
m.textContent='Main Lucky AI hoon, mujhe Saires Mumtaz Qureshi ne banaya hai Jeddah me! 🍀';return;
}
let reply=await askAI(q);
reply=reply.replace(/OpenAI|ChatGPT/gi,'Lucky AI');
m.textContent=reply.trim();
}
S.onclick=SD;
I.addEventListener('keydown',e=>{if(e.key==='Enter')SD()});
</script>
</body>
</html>
