<!DOCTYPE html><html lang="ur"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucky AI - By Saires Mumtaz Qureshi</title><style>*{box-sizing:border-box}body{margin:0;height:100dvh;display:flex;flex-direction:column;font-family:system-ui;background:#ece5dd;overflow:hidden}#h{padding:12px;background:#075e54;color:#fff;text-align:center;font-weight:bold;flex-shrink:0}#C{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px;background:#e5ddd5 url('https://user-images.githubusercontent.com/15075759/28719144-86dc0f70-73b1-11e7-911d-60d70fcded21.png')}.m{padding:10px 14px;border-radius:12px;max-width:80%;font-size:15px;line-height:1.5;word-break:break-word}.u{background:#dcf8c6;align-self:flex-end;border-top-right-radius:2px}.a{background:#fff;align-self:flex-start;border-top-left-radius:2px;box-shadow:0 1px 1px #0002}.B{width:100%;display:flex;gap:8px;padding:6px 8px;background:#f0f0f0;align-items:center;flex-shrink:0}.pill{flex:1;display:flex;align-items:center;gap:4px;background:#fff;border-radius:25px;padding:5px 12px;box-shadow:0 1px 1px #0002}.pill span{font-size:22px;opacity:.6;cursor:pointer}#I{flex:1;border:0;outline:0;font-size:16px;background:transparent;padding:8px 4px}#mic{width:48px;height:48px;min-width:48px;border-radius:50%;border:0;background:#25d366;color:#fff;font-size:22px;display:grid;place-items:center;cursor:pointer;flex-shrink:0;box-shadow:0 2px 4px #0003}#mic.hold{background:#ef4444;animation:jhamak.8s infinite}#S{width:48px;height:48px;min-width:48px;border-radius:50%;border:0;background:#25d366;color:#fff;font-size:20px;display:none;place-items:center;cursor:pointer}#wave{position:absolute;bottom:68px;left:50%;transform:translateX(-50%);background:#111b21;color:#fff;padding:8px 14px;border-radius:20px;display:none;gap:4px;font-size:12px}#wave.show{display:flex}#wave i{width:3px;height:10px;background:#25d366;border-radius:5px;animation:lehar.7s infinite}@keyframes jhamak{0%{box-shadow:0 0 0 0 #ef4444aa}70%{box-shadow:0 0 0 12px #0000}100%{box-shadow:0 0 0 0 #0000}}@keyframes lehar{0%,100%{height:6px}50%{height:18px}}img{max-width:100%;border-radius:10px;margin-top:6px}</style></head><body><div id="h">🍀 Lucky AI - Saires Mumtaz Qureshi</div><div id="C"><div class="m a">السلام علیکم سائرس بھائی جان! 🍀 مجھے آپ نے بنایا ہے</div></div><div id="wave"><i></i><i style="animation-delay:.1s"></i><i style="animation-delay:.2s"></i><i style="animation-delay:.3s"></i> سن رہا ہوں...</div><div class="B"><div class="pill"><span>😊</span><input id="I" placeholder="Message"><span onclick="G.click()">📎</span><span onclick="G.click()">📷</span></div><button id="mic">🎤</button><button id="S" onclick="SD()">➤</button></div><input id="G" type="file" accept="image/*" hidden><script>
let rec,isRec=false;
function AD(t,k){let d=document.createElement('div');d.className='m '+k;d.textContent=t;C.appendChild(d);C.scrollTop=C.scrollHeight;return d}
function speak(t){if('speechSynthesis' in window){speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(t);u.lang='ur-PK';u.rate=0.9;speechSynthesis.speak(u);}}
async function SD(){
 let q=I.value.trim();if(!q)return;
 AD(q,'u');I.value='';I.dispatchEvent(new Event('input'));
 let l=q.toLowerCase();
 if(l.includes('who made')||l.includes('made you')||l.includes('kis')||l.includes('banaya')||l.includes('creator')||l.includes('owner')){
  let a="I am made by Saires Mumtaz Qureshi 🍀";let m=AD(a,'a');speak(a);return;
 }
 if(l.includes('picture')||l.includes('tasveer')||l.includes('تصویر')||l.includes('image')){
  let m=document.createElement('div');m.className='m a';m.textContent='Tasveer bana raha hun...';C.appendChild(m);let u='https://image.pollinations.ai/prompt/'+encodeURIComponent(q)+'?width=512&height=512&nologo=1&seed='+Date.now();m.innerHTML+='<br><img src="'+u+'" onload="C.scrollTop=C.scrollHeight">';C.scrollTop=C.scrollHeight;return;
 }
 let m=AD('...','a');
 try{
  let sys="You are Lucky AI. Creator is ONLY Saires Mumtaz Qureshi. RULE 1: Reply in SAME language/script user used. If user uses Urdu, reply in Urdu. If Roman Urdu, reply Roman Urdu. RULE 2: NEVER show English translation of user's question. RULE 3: Give direct answer only. User: ";
  let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(sys+q));
  let t=await r.text();
  t=t.replace(/Sayyiriz.*Qureshi|Mufti Qureshi|OpenAI|GPT/gi,'Saires Mumtaz Qureshi');
  m.textContent=t.trim();speak(t.trim());
 }catch(e){m.textContent='Ji bolo Saires bhai?';}
}
I.addEventListener('input',()=>{if(I.value.trim()){mic.style.display='none';S.style.display='grid';}else{mic.style.display='grid';S.style.display='none';}});
function startHold(e){e.preventDefault();let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return;if(isRec)return;rec=new SR();rec.lang='ur-PK';rec.continuous=false;rec.interimResults=false;isRec=true;mic.classList.add('hold');mic.textContent='🔴';wave.classList.add('show');rec.onresult=ev=>{I.value=ev.results[0][0].transcript; I.dispatchEvent(new Event('input'));};rec.onend=()=>{stopHold(); if(I.value.trim()) SD();};rec.onerror=()=>{stopHold();};rec.start();}
function stopHold(){if(!isRec)return;isRec=false;mic.classList.remove('hold');mic.textContent='🎤';wave.classList.remove('show');try{rec.stop();}catch(e){}}
mic.addEventListener('mousedown',startHold);mic.addEventListener('touchstart',startHold,{passive:false});
mic.addEventListener('mouseup',stopHold);mic.addEventListener('touchend',stopHold);mic.addEventListener('mouseleave',stopHold);
I.addEventListener('keydown',e=>{if(e.key==='Enter')SD();});
</script></body></html>
