<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucky AI</title><style>
body{margin:0;height:100vh;display:flex;flex-direction:column;background:#0f172a;font-family:system-ui}
#ch{flex:1;overflow:auto;padding:10px 10px 90px;background:#fff;display:flex;flex-direction:column;gap:8px}
.m{padding:9px 12px;border-radius:14px;max-width:85%;font-size:15px;word-break:break-word}
.u{background:#22c55e;align-self:flex-end;color:#fff}.a{background:#eee;align-self:flex-start}
.B{position:fixed;bottom:0;left:0;right:0;display:flex;gap:6px;padding:8px;background:#1e293b;align-items:center}
.pill{flex:1;display:flex;align-items:center;gap:6px;background:#fff;border-radius:24px;padding:4px 10px}
#I{flex:1;min-width:0;border:0;outline:0;padding:10px;font-size:15px}
#mic{width:48px;height:48px;min-width:48px;border-radius:50%;border:0;background:#22c55e;font-size:20px}
#mic.hold{background:#ef4444;animation:jhamak 0.8s infinite}
@keyframes jhamak{0%{box-shadow:0 0 0 0 #ef4444}100%{box-shadow:0 0 0 10px transparent}}
#S{width:48px;height:48px;min-width:48px;border-radius:50%;border:0;background:#22c55e;color:#fff;font-size:18px}
#wave{position:absolute;bottom:70px;left:0;right:0;text-align:center;color:#22c55e;display:none}
</style></head><body>
<div id="ch"><div class="m a">Salam bhai! Lucky AI 🍀 ready hai</div></div>
<div id="wave">🎤 Sun raha hun...</div>
<div class="B">
 <div class="pill">
  <span>🙂</span>
  <input id="I" placeholder="Message Lucky AI...">
  <span onclick="G.click()">📎</span>
  <span onclick="G.click()">📷</span>
 </div>
 <button id="mic">🎤</button>
 <button id="S" onclick="SD()">➤</button>
</div>
<input id="G" type="file" accept="image/*" style="display:none">
<script>
const CREATOR_NAME="Saires Mumtaz Qureshi";
function AD(t,k){let d=document.createElement('div');d.className='m '+k;d.textContent=t;ch.appendChild(d);ch.scrollTop=9e9;return d}
function speak(t){if('speechSynthesis' in window){let u=new SpeechSynthesisUtterance(t);u.lang='ur-PK';speechSynthesis.speak(u)}}
async function SD(){
 let q=I.value.trim();if(!q)return;AD(q,'u');I.value='';
 let l=q.toLowerCase();
 if(l.includes('who made')||l.includes('kis ne banaya')||l.includes('creator')){
  AD("Mujhe "+CREATOR_NAME+" ne banaya hai Mecca, Saudi Arabia me!","a");return;
 }
 if(l.includes('picture')||l.includes('tasveer')||l.includes('image')||l.includes('photo')){
  AD("Bhai picture bhejo, main dekh lunga! 📷","a");return;
 }
 let m=AD('Soch raha hun...','a');
 try{
  let sys="You are Lucky AI. Creator is "+CREATOR_NAME+" from Mecca. Reply in same language as user (Urdu/Hindi/English mix). Be friendly.";
  let r=await fetch("https://api.groq.com/openai/v1/chat/completions",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({model:"llama-3.1-8b-instant",messages:[{role:"system",content:sys},{role:"user",content:q}]})}).then(x=>x.json()).catch(()=>null);
  let ans=r&&r.choices?r.choices[0].message.content:"Aap ne kaha: "+q+" - MashaAllah!";
  m.textContent=ans;speak(ans);
 }catch(e){m.textContent="Net slow hai bhai, phir try karo!"}
}
I.addEventListener('input',()=>{if(I.value.trim()){S.style.background="#22c55e"}else{S.style.background="#555"}});
let isRec=false;let rec;
function startHold(e){e.preventDefault();isRec=true;mic.classList.add('hold');wave.style.display='block';
 let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(SR){rec=new SR();rec.lang='ur-PK';rec.onresult=(ev)=>{I.value=ev.results[0][0].transcript};rec.onend=()=>{stopHold()};rec.start();}}
function stopHold(){if(!isRec)return;isRec=false;mic.classList.remove('hold');wave.style.display='none';if(rec)try{rec.stop()}catch{}}
let mic=document.getElementById('mic');
mic.addEventListener('mousedown',startHold);mic.addEventListener('mouseup',stopHold);
mic.addEventListener('touchstart',startHold);mic.addEventListener('touchend',stopHold);
I.onkeydown=e=>{if(e.key==='Enter')SD()}
</script></body></html>
