<!DOCTYPE html>
<html lang="ur" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lucky AI - سائرس ممتاز قریشی</title>
<style>
body{font-family:sans-serif;background:#0a0a0a;color:#fff;margin:0;display:flex;flex-direction:column;height:100vh}
header{background:#000;padding:15px;text-align:center;border-bottom:2px solid #0f0;font-weight:bold}
#chat{flex:1;overflow-y:auto;padding:15px;padding-bottom:90px}
.user{background:#1e90ff;padding:12px;border-radius:18px 18px 0 18px;margin:10px 0 10px 20%;text-align:right}
.bot{background:#222;padding:12px;border-radius:18px 18px 18px 0;margin:10px 20% 10px 0;border-left:3px solid #0f0;white-space:pre-wrap}
.bot img{max-width:100%;border-radius:10px;margin-top:8px}
#inputArea{display:flex;gap:8px;padding:12px;background:#000;position:fixed;bottom:0;width:100%;box-sizing:border-box;direction:ltr}
#msg{flex:1;padding:14px;border-radius:25px;border:1px solid #333;background:#1a1a1a;color:#fff;outline:none}
#sendBtn{background:#0f0;color:#000;font-weight:bold;border-radius:25px;padding:12px 22px;border:none}
#voiceBtn{background:#333;color:#fff;padding:12px;border-radius:50%;border:none}
</style>
</head>
<body>
<header>✨ Lucky AI - سائرس ممتاز قریشی ✨</header>
<div id="chat"><div class="bot">السلام علیکم! میں Lucky AI ہوں، مجھے سائرس ممتاز قریشی نے بنایا ہے۔</div></div>
<div id="inputArea">
<button id="voiceBtn" onclick="startVoice()">🎤</button>
<input id="msg" placeholder="اردو / English...">
<button id="sendBtn" onclick="send()">Send</button>
</div>
<script>
const _k1 = "AQ.Ab8RN6JSn6l2RxFfV94MvYJbF9YGVDGJobNfVU4uryZYjY0k";
const _k2 = "Ow";
const API_KEY = _k1 + _k2;
const chatDiv = document.getElementById('chat');
const SYSTEM_PROMPT = "You are Lucky AI. Creator is سائرس ممتاز قریشی. If asked who made you, say مجھے سائرس ممتاز قریشی نے بنایا ہے. Speak Urdu and English.";

function addMsg(t,c,img=""){let d=document.createElement('div');d.className=c;d.innerText=t;if(img){let im=document.createElement('img');im.src=img;d.appendChild(document.createElement('br'));d.appendChild(im);}chatDiv.appendChild(d);chatDiv.scrollTop=chatDiv.scrollHeight;}

async function send(){
  let inp=document.getElementById('msg'); let text=inp.value.trim(); if(!text) return;
  addMsg(text,'user'); inp.value="";
  if(text.includes('تصویر')||text.toLowerCase().includes('tasveer')||text.toLowerCase().includes('image')){
    let p=text.replace(/تصویر|tasveer|image banao/gi,'').trim()||text;
    let url=`https://image.pollinations.ai/prompt/${encodeURIComponent(p)}?width=1024&height=1024&nologo=true`;
    addMsg(`یہ لیں تصویر: ${p}`,'bot',url); return;
  }
  try{
    let res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent`,{method:"POST",headers:{"Content-Type":"application/json","x-goog-api-key":API_KEY},body:JSON.stringify({contents:[{parts:[{text:SYSTEM_PROMPT+"\nUser: "+text}]}]})});
    let data=await res.json(); addMsg(data.candidates[0].content.parts[0].text,'bot');
  }catch(e){addMsg("Error: "+e.message,'bot');}
}
function startVoice(){
  const SR=window.SpeechRecognition||window.webkitSpeechRecognition; if(!SR){alert("Voice nahi");return;}
  let rec=new SR(); rec.lang='ur-PK'; rec.onresult=(e)=>{document.getElementById('msg').value=e.results[0][0].transcript; send();}; rec.start();
}
</script>
</body>
</html>
