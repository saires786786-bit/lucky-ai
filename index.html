<!doctype html><html><head><meta charset="utf-8"><meta name=viewport content='width=device-width'><title>Lucky AI</title><style>body{background:#0f172a;color:#fff;font-family:sans-serif;display:flex;justify-content:center;padding:20px}div{width:100%;max-width:500px}#c{height:60vh;overflow:auto;background:#fff;color:#000;padding:10px;border-radius:10px}p{padding:8px;border-radius:8px;margin:5px;white-space:pre-wrap;word-wrap:break-word}.u{background:#22c55e;color:#fff;text-align:right}.a{background:#eee}</style></head><body><div><h2>Lucky AI</h2><div id=c><p class=a>Salam! Poocho kuch</p></div><br><input id=i style=width:75%;padding:10px;border-radius:20px><button onclick=s() style=padding:10px>Send</button></div><script>async function s(){let q=i.value.trim();if(!q)return;c.innerHTML+=`<p class=u>${q}</p>`;i.value='';let d=document.createElement('p');d.className='a';d.innerText='Sooch raha hun...';c.appendChild(d);c.scrollTop=c.scrollHeight;let low=q.toLowerCase();if(low.includes('salam')||low.includes('salm')||low.includes('aslam')){d.innerText='Walaikum As-Salam bhai! 😊 Batao kya haal hai, kya madad karun?';return}if(low.includes('kesy ho')||low.includes('kese ho')||low.includes('kya hal')||low.includes('kaise ho')){d.innerText='Alhamdulillah bhai ekdum zabardast! Aap sunao, kya haal hai aapka?';return}if(low.includes('kon ho')||low.includes('naam kya')){d.innerText='Main Lucky AI hun, aapka apna desi AI dost!';return}try{let prompt=`Hamesha Urdu Roman (Hindi-Urdu mix) me jawab do. Salam ka jawab Walaikum As-Salam se do. User ka sawal: ${q}`;let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(prompt)+'?model=openai&seed='+Date.now());let a=await r.text();if(!a||a=='{}'||a.length<3){throw 'empty'}d.innerText=a;}catch(e){d.innerText='Bhai network slow hai, dobara poocho. Lekin main yahan hun, bolo kya chahiye?';}c.scrollTop=c.scrollHeight}</script></body></html>
