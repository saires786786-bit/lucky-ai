<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucky AI - Saires</title>
<style>
*{box-sizing:border-box;margin:0}
body{height:100dvh;display:flex;flex-direction:column;background:#efe7dd;font-family:system-ui;overflow:hidden}
#h{padding:12px;background:#075e54;color:#fff;text-align:center;font-weight:bold}
#C{flex:1;overflow:auto;padding:12px 12px 90px;display:flex;flex-direction:column;gap:8px}
.m{padding:10px 14px;border-radius:18px;max-width:80%;font-size:15px;word-wrap:break-word}
.u{background:#dcf8c6;align-self:flex-end;border-bottom-right-radius:4px}
.a{background:#fff;align-self:flex-start;border-bottom-left-radius:4px;white-space:pre-wrap}
.B{position:fixed;bottom:0;left:0;right:0;background:#f0f0f0;padding:8px 6px 8px 10px;display:flex;align-items:center;gap:6px;width:100%}
.pill{flex:1;min-width:0;background:#fff;border-radius:28px;display:flex;align-items:center;padding:5px 10px;gap:6px;box-shadow:0 1px 1px #0002}
.pill input{flex:1;min-width:0;border:0;outline:0;font-size:16px;padding:8px 4px;background:transparent}
.ic{font-size:20px;flex-shrink:0}
#mic,#S{width:44px;height:44px;min-width:44px;max-width:44px;border-radius:50%;border:0;background:#25d366;color:#fff;font-size:20px;display:grid;place-items:center;flex-shrink:0;cursor:pointer}
#S{display:none}
</style>
</head>
<body>
<div id="h">🍀 Lucky AI - Saires Mumtaz Qureshi</div>
<div id="C"><div class="m a">Salam Saires bhai! 🍀 Main Lucky AI hoon, bolo kya help chahiye?</div></div>
<div class="B">
<div class="pill"><span class="ic">😊</span><input id="I" placeholder="Message" autocomplete="off"><span class="ic">📎</span><span class="ic">📷</span></div>
<button id="mic">🎤</button><button id="S">➤</button>
</div>
<script>
let C=document.getElementById('C'),I=document.getElementById('I'),mic=document.getElementById('mic'),S=document.getElementById('S');
function AD(t,k){let d=document.createElement('div');d.className='m '+k;d.textContent=t;C.appendChild(d);C.scrollTop=C.scrollHeight;return d}
async function SD(){
 let q=I.value.trim(); if(!q) return;
 AD(q,'u'); I.value=''; mic.style.display='grid'; S.style.display='none';
 let m=AD('Soch raha hoon...','a');
 try{
  let r=await fetch('https://text.pollinations.ai/'+encodeURIComponent(q));
  let txt=await r.text();
  try{let j=JSON.parse(txt); if(j.choices && j.choices[0]) txt=j.choices[0].message.content;}catch(e){}
  txt=txt.trim();
  if(!txt || txt=='{}' || txt.length<2){
    let low=q.toLowerCase();
    if(low.includes('kesy')||low.includes('kese')) txt='Alhamdulillah Saires bhai main bilkul theek hoon! 🍀 Aap sunao?';
    else if(low.includes('hi')||low.includes('salam')) txt='Wa Alaikum Salam Saires bhai! 🍀 Main Lucky AI hoon!';
    else txt='Ji Saires bhai bolo? 🍀 '+q;
  }
  m.textContent=txt;
 }catch(e){ m.textContent='Net slow hai bhai, dobara bolo? 🍀'; }
}
S.onclick=SD;
I.addEventListener('input',()=>{if(I.value.trim()){mic.style.display='none';S.style.display='grid'}else{mic.style.display='grid';S.style.display='none'}});
I.addEventListener('keydown',e=>{if(e.key==='Enter')SD()});
</script>
</body>
</html>
