<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucky AI Saires Mumtaz Qureshi</title><style>*{margin:0;padding:0;box-sizing:border-box;font-family:system-ui}body{height:100dvh;background:#f0fdf4;display:flex;flex-direction:column}.top{padding:14px;text-align:center;background:#fff;font-weight:800;font-size:18px;color:#14532d}.center{display:flex;flex-direction:column;align-items:center;padding:16px;gap:10px}#orb{width:220px;height:220px;border-radius:50%;object-fit:cover;border:6px solid #fff;box-shadow:0 0 35px #22c55e99}#orb.speak{transform:scale(1.08)}#C{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}.m{padding:12px 16px;border-radius:20px;max-width:88%;font-size:15px;line-height:1.7;white-space:pre-wrap}.u{background:#22c55e;color:#fff;align-self:flex-end}.a{background:#fff;align-self:flex-start;box-shadow:0 2px 6px #0001}.bottom{display:flex;gap:8px;padding:12px;background:#fff;border-top:1px solid #e5e7eb}.pill{flex:1;background:#f1f5f9;border-radius:28px;padding:12px 18px;display:flex}.pill input{border:0;outline:0;flex:1;background:transparent;font-size:15px}.btn{width:48px;height:48px;border-radius:50%;border:0;font-size:20px;cursor:pointer}#sendBtn{background:#22c55e;color:#fff}#micBtn{background:#e2e8f0}</style></head><body><div class="top">🍀 Lucky AI Saires Mumtaz Qureshi</div><div class="center"><img id="orb" src="profile.jpg?v=999"><div id="status" style="color:#15803d;font-size:13px;background:#dcfce7;padding:6px 14px;border-radius:20px;font-weight:600">السلام علیکم سائرس بھائی!</div></div><div id="C"></div><div id="typing" style="display:none;padding:6px 14px;color:#666;font-size:13px">سوچ رہی ہوں...</div><div class="bottom"><div class="pill"><input id="I" placeholder="اردو میں کچھ بھی پوچھو..."></div><button class="btn" id="micBtn" onclick="startVoice()">🎤</button><button class="btn" id="sendBtn" onclick="sendMsg()">➤</button></div><script>
const C=document.getElementById('C'),I=document.getElementById('I'),orb=document.getElementById('orb'),typing=document.getElementById('typing');
const SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec;
const SYSTEM="تم Lucky AI ہو، تمہیں Saires Mumtaz Qureshi نے بنایا ہے۔ تم بہت ذہین ہو، پوری دنیا کے سوالوں کا جواب اردو میں دیتی ہو۔ ہمیشہ عزت سے بات کرو۔";
function addMsg(t,c){let d=document.createElement('div');d.className='m '+c;d.textContent=t;C.appendChild(d);C.scrollTop=C.scrollHeight;}
function speak(t){orb.classList.add('speak');let u=new SpeechSynthesisUtterance(t.replace(/[*#]/g,''));u.lang='ur-PK';u.rate=0.92;u.onend=()=>orb.classList.remove('speak');speechSynthesis.cancel();speechSynthesis.speak(u);}
async function askAI(q){try{typing.style.display='block';const p=SYSTEM+"\nسوال: "+q+"\nجواب اردو میں تفصیل سے دو:";const url="https://text.pollinations.ai/"+encodeURIComponent(p)+"?model=openai&seed="+Date.now();const r=await fetch(url);return (await r.text()).trim();}catch(e){let l=q.toLowerCase();if(l.includes('salam'))return 'وعلیکم السلام سائرس ممتاز قریشی! ❤️ کیا حال ہے؟';if(l.includes('banaya')||l.includes('kis ne'))return 'مجھے سائرس ممتاز قریشی نے بنایا ہے 🍀';if(l.includes('pakistan'))return 'پاکستان قائد اعظم محمد علی جناح نے 14 اگست 1947 کو بنایا تھا۔ پاکستان کا مطلب لا الہ الا اللہ!';return 'سائرس بھائی نیٹ ورک سلو ہے، دوبارہ پوچھو!';}finally{typing.style.display='none';}}
async function sendMsg(){let q=I.value.trim();if(!q)return;addMsg(q,'u');I.value='';let r=await askAI(q);addMsg(r,'a');speak(r);}
I.addEventListener('keydown',e=>{if(e.key==='Enter')sendMsg();});document.getElementById('sendBtn').onclick=sendMsg;
function startVoice(){if(!SR){alert('کروم میں کھولو');return;}rec=new SR();rec.lang='ur-PK';rec.onstart=()=>{orb.classList.add('speak');typing.style.display='block';typing.textContent='سن رہی ہوں...';};rec.onresult=e=>{I.value=e.results[0][0].transcript;};rec.onend=()=>{orb.classList.remove('speak');typing.style.display='none';if(I.value.trim())sendMsg();};rec.start();}
