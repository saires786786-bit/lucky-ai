<!doctype html><html><head><meta charset="utf-8"><meta name=viewport content="width=device-width"><title>Lucky AI Pro</title><style>body{background:#0f172a;color:#fff;font-family:sans-serif;display:flex;justify-content:center;padding:12px;margin:0}.box{width:100%;max-width:520px} #c{height:68vh;overflow:auto;background:#fff;color:#000;padding:10px;border-radius:14px} p{padding:10px;border-radius:12px;margin:7px 0;word-break:break-word}.u{background:#22c55e;color:#fff;text-align:right}.a{background:#f1f5f9} img.chat-img{max-width:100%;border-radius:10px;margin-top:6px}.bar{display:flex;gap:6px;margin-top:10px} input{flex:1;padding:13px;border-radius:22px;border:0;outline:none} button{padding:12px 14px;border-radius:12px;border:0;background:#334155;color:#fff} #send{background:#22c55e}</style></head><body><div class=box><h2 style=text-align:center>Lucky AI - Camera + Mic + Image</h2><div id=c><p class=a>السلام علیکم بھائی! اب آپ تصویر بنا سکتے ہو، کیمرہ سے تصویر بھیج سکتے ہو، اور مائیک سے بول بھی سکتے ہو!</p></div><div class=bar><button onclick="document.getElementById('f').click()">📷</button><button onclick="genImg()">🖼️</button><button id=micBtn onclick="startMic()">🎤</button><input id=i placeholder="لکھو یا بولو..."><button id=send onclick=s()>Send</button></div><input type=file id=f accept="image/*" hidden></div><script>
let c=document.getElementById('c'), inp=document.getElementById('i');
document.getElementById('f').onchange=e=>{
  let file=e.target.files[0]; if(!file)return;
  let r=new FileReader(); r.onload=ev=>{
    c.innerHTML+=`<p class=u>📷 تصویر بھیجی ہے<br><img class=chat-img src="${ev.target.result}"></p>`;
    c.scrollTop=c.scrollHeight;
  }; r.readAsDataURL(file);
};
async function s(){
  let q=inp.value.trim(); if(!q)return;
  c.innerHTML+=`<p class=u>${q}</p>`; inp.value='';
  let d=document.createElement('p'); d.className='a'; d.innerText='...'; c.appendChild(d); c.scrollTop=c.scrollHeight;
  try{ let res=await fetch('https://text.pollinations.ai/'+encodeURIComponent(q)); let t=await res.text(); d.innerText=t; }catch(e){ d.innerText='نیٹ سلو ہے، دوبارہ بھیجو'; } c.scrollTop=c.scrollHeight;
}
async function genImg(){
  let q=inp.value.trim(); if(!q){ alert('پہلے لکھو کونسی تصویر بنانی ہے! مثلا: A beautiful cat'); return; }
  c.innerHTML+=`<p class=u>🖼️ تصویر بناؤ: ${q}</p>`; inp.value='';
  let d=document.createElement('p'); d.className='a'; d.innerHTML=`تصویر بن رہی ہے... ⏳`;
  c.appendChild(d); c.scrollTop=c.scrollHeight;
  let url='https://image.pollinations.ai/prompt/'+encodeURIComponent(q)+'?nologo=1&seed='+Date.now();
  d.innerHTML=`یہ رہی آپ کی تصویر:<br><img class=chat-img src="${url}" onload="c.scrollTop=c.scrollHeight">`;
  c.scrollTop=c.scrollHeight;
}
function startMic(){
  let btn=document.getElementById('micBtn');
  let SR=window.SpeechRecognition||window.webkitSpeechRecognition;
  if(!SR){ alert('آپ کے موبائل میں مائیک سپورٹ نہیں، Chrome میں کھولو'); return; }
  let rec=new SR(); rec.lang='ur-PK'; rec.start(); btn.innerText='🔴'; btn.style.background='#ef4444';
  rec.onresult=e=>{ inp.value=e.results[0][0].transcript; };
  rec.onend=()=>{ btn.innerText='🎤'; btn.style.background='#334155'; };
}
</script></body></html>
