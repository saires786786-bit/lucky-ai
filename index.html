<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucky</title>
<style>
*{margin:0;box-sizing:border-box}
body{font-family:system-ui;display:flex;flex-direction:column;height:100dvh;background:#efe7dd}
#h{background:#075e54;color:#fff;padding:12px;text-align:center;font-weight:bold}
#c{flex:1;overflow:auto;padding:10px;padding-bottom:80px}
.m{padding:8px 12px;border-radius:14px;max-width:80%;margin:4px 0}
.u{background:#dcf8c6;align-self:flex-end;margin-left:auto}
.a{background:#fff;align-self:flex-start}
#b{position:fixed;bottom:0;left:0;right:0;display:flex;padding:6px;background:#f0f0f0;gap:6px}
#i{flex:1;border:0;border-radius:20px;padding:10px 14px;outline:0}
#s{border:0;background:#25d366;color:#fff;width:42px;height:42px;border-radius:50%}
</style>
</head>
<body>
<div id="h">Lucky AI - Saires Qureshi</div>
<div id="c"></div>
<div id="b">
<input id="i" placeholder="Sawal likho...">
<button id="s">></button>
</div>
<script>
let c=document.getElementById('c');
let i=document.getElementById('i');
let s=document.getElementById('s');
let A="https://text.pollinations.ai/openai";
function M(t,k){
let d=document.createElement('div');
d.className='m '+k;
d.textContent=t;
c.appendChild(d);
c.scrollTop=1e9;
return d;
}
async function Q(q){
let p="You are Lucky AI by Saires Qureshi. Answer in Roman Urdu. Quaid=Jinnah. Iqbal=poet. You know all.";
let b={model:"openai",messages:[{role:"system",content:p},{role:"user",content:q}]};
let r=await fetch(A,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(b)});
let j=await r.json();
return j.choices[0].message.content;
}
async function SND(){
let q=i.value.trim();
if(!q)return;
M(q,'u');
i.value='';
let m=M('...','a');
let a=await Q(q);
m.textContent=a;
}
s.onclick=SND;
i.onkeydown=e=>{if(e.key=='Enter')SND()};
</script>
</body>
</html>
