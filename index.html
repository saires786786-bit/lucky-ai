<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Lucky AI - Smart Assistant</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:Arial}
body{background:#0f172a;color:white;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.container{width:100%;max-width:500px;background:#1e293b;border-radius:20px;padding:25px}
h1{text-align:center;font-size:28px}
h1 span{color:#22c55e}
.sub{text-align:center;color:#94a3b8;margin-bottom:20px;font-size:14px}
.box{background:white;border-radius:15px;padding:15px}
#chat{height:300px;overflow-y:auto;color:#0f172a;margin-bottom:12px}
.msg{padding:10px 14px;border-radius:12px;margin:8px 0;max-width:85%;font-size:14px}
.user{background:#22c55e;color:white;margin-left:auto}
.ai{background:#e2e8f0;color:#0f172a}
.input-area{display:flex;gap:8px}
input{flex:1;padding:12px;border-radius:25px;border:1px solid #cbd5e1;outline:none}
button{padding:12px 18px;border:none;border-radius:25px;background:#22c55e;color:white;font-weight:bold}
</style>
</head>
<body>
<div class="container">
<h1>🌟 <span>Lucky AI</span></h1>
<p class="sub">Your Smart Assistant - Ask Anything!</p>
<div class="box">
<div id="chat"><div class="msg ai">Assalamu Alaikum! Main Lucky AI hun. Aap mujhse kuch bhi pooch sakte ho ✨</div></div>
<div class="input-area">
<input id="userInput" placeholder="Type your message...">
<button onclick="send()">Send</button>
</div>
</div>
</div>
<script>
const chat=document.getElementById('chat');
const input=document.getElementById('userInput');
const replies=["MashaAllah bohat acha sawal! 🌟","Lucky AI kehta hai: Mehnat jari rakho 🍀","Wow! Aap lucky ho! Kamyabi qareeb hai ✨","Sabr aur Shukr se sab milta hai!","Zabardast! Iska hal ye hai ke himmat na haro."];
function send(){let t=input.value.trim();if(!t)return;addMsg(t,'user');input.value='';setTimeout(()=>{let r=replies[Math.floor(Math.random()*replies.length)];addMsg(r+"<br><br><b>Q:</b> "+t,'ai');},600);}
function addMsg(t,c){let d=document.createElement('div');d.className='msg '+c;d.innerHTML=t;chat.appendChild(d);chat.scrollTop=chat.scrollHeight;}
input.addEventListener('keypress',e=>{if(e.key==='Enter')send();});
</script>
</body>
</html>
