<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucky AI</title>
<style>
body{margin:0;background:#0f172a;color:#fff;font-family:system-ui;display:flex;flex-direction:column;height:100vh}
#chat{flex:1;background:#fff;color:#000;padding:10px;overflow:auto}
.msg{padding:8px 12px;border-radius:12px;margin:6px 0;max-width:85%}
.user{background:#22c55e;align-self:flex-end;margin-left:auto}
.ai{background:#eee}
.bottom{display:flex;padding:10px;background:#1e293b;gap:6px}
#input{flex:1;padding:12px;border-radius:20px;border:none}
#send{background:#22c55e;border:none;width:48px;height:48px;border-radius:50%;font-size:20px}
</style>
</head>
<body>
<div id="chat"><div class="msg ai">السلام علیکم! میں Lucky AI ہوں 🍀</div></div>
<div class="bottom">
<input id="input" placeholder="یہاں لکھیں...">
<button id="send" onclick="send()">➤</button>
</div>
<script>
function send(){
let i=document.getElementById('input');
let t=i.value.trim();
if(!t)return;
let c=document.getElementById('chat');
let d=document.createElement('div');
d.className='msg user';
d.innerText=t;
c.appendChild(d);
i.value='';
c.scrollTop=9999;
setTimeout(()=>{
let a=document.createElement('div');
a.className='msg ai';
a.innerText='آپ نے کہا: '+t;
c.appendChild(a);
c.scrollTop=9999;
},500);
}
document.getElementById('input').addEventListener('keydown',e=>{if(e.key==='Enter')send()});
</script>
</body>
</html>
