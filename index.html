<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucky AI</title><style>body{margin:0;background:#0f172a;color:#fff;font-family:sans-serif;display:flex;justify-content:center}.box{width:100%;max-width:520px;height:100vh;display:flex;flex-direction:column;padding:10px;box-sizing:border-box}h2{text-align:center;color:#22c55e;margin:5px}.lang{display:flex;gap:4px;justify-content:center;margin-bottom:8px;flex-wrap:wrap}.lang button{padding:6px 10px;border-radius:20px;border:0;background:#334155;color:#fff;font-size:13px}.lang button.active{background:#22c55e}#c{flex:1;overflow:auto;background:#fff;color:#000;padding:10px;border-radius:15px}.u{background:#22c55e;color:#fff;margin-left:auto;text-align:right;padding:8px 12px;border-radius:12px;margin:6px 0;max-width:80%;float:right;clear:both;word-break:break-word}.a{background:#f1f5f9;color:#000;padding:8px 12px;border-radius:12px;margin:6px 0;max-width:80%;float:left;clear:both;word-break:break-word}img.i{max-width:100%;border-radius:10px}.bar{display:flex;gap:5px;margin-top:8px;background:#1e293b;padding:6px;border-radius:25px}button.ic{background:#334155;border:0;color:#fff;width:40px;height:40px;border-radius:50%}#in{flex:1;padding:10px;border-radius:20px;border:0}#send{background:#22c55e!important}</style></head><body><div class=box><h2>✨ Lucky AI ✨</h2><div class=lang><button id=b1 onclick="L('en')">English</button><button id=b2 onclick="L('ar')">عربي</button><button id=b3 class=active onclick="L('ur')">اردو</button><button id=b4 onclick="L('roman')">Roman</button></div><div id=c></div><div class=bar><button class=ic onclick="f.click()">📷</button><button class=ic onclick="gI()">🖼️</button><button class=ic id=mc onclick="mic()">🎤</button><input id=in placeholder="کچھ لکھو..."><button class=ic id=send onclick="s()">➤</button></div><input type=file id=f hidden accept="image/*"></div><script>
let lang='ur';let T={en:{ph:"Write something...",hi:"Hello! I am ready",th:"Thinking..."},ar:{ph:"اكتب شيئا...",hi:"السلام عليكم! أنا جاهز",th:"أفكر..."},ur:{ph:"کچھ لکھو...",hi:"السلام علیکم! میں تیار ہوں",th:"سوچ رہا ہوں..."},roman:{ph:"Kuch likho...",hi:"Assalamu Alaikum! Main tayar hun",th:"Soch raha hun..."}};
function L(l){lang=l;document.querySelectorAll('.lang button').forEach(b=>b.classList.remove('active'));document.getElementById({en:'b1',ar:'b2',ur:'b3',roman:'b4'}[l]).classList.add('active');document.getElementById('in').placeholder=T[l].ph;c.innerHTML=`<div class=a>${T[l].hi}</div>`}
let c=document.getElementById('c'),i=document.getElementById('in');L('ur');
f.onchange=e=>{let file=e.target.files[0];let r=new FileReader();r.onload=ev=>{c.innerHTML+=`<div class=u><img class=i src="${ev.target.result}"></div>`;c.scrollTop=9999};r.readAsDataURL(file)};
async function s(){let q=i.value.trim();if(!q)return;c.innerHTML+=`<div class=u>${q}</div>`;i.value='';let d=document.createElement('div');d.className='a';d.innerText=T[lang].th;c.appendChild(d);c.scrollTop=9999;let p=q;if(lang=='ar')p="أجب بالعربية: "+q;if(lang=='ur')p="اردو میں جواب دو: "+q;if(lang=='roman')p="Roman Urdu me jawab do: "+q;try{let r=await fetch('https://ai.hackclub.com/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({messages:[{role:'user',content:p}]})});let j=await r.json();d.innerText=j.choices[0].message.content}catch(e){d.innerText='Error'}c.scrollTop=9999}
async function gI(){let q=i.value.trim();if(!q)return alert('Pehle likho kya banana hai / Write what to create');c.innerHTML+=`<div class=u>🖼️ ${q}</div>`;let d=document.createElement('div');d.className='a';d.innerText='Image...';c.appendChild(d);let u='https://image.pollinations.ai/prompt/'+encodeURIComponent(q)+'?seed='+Date.now();d.innerHTML=`<img class=i src="${u}">`;c.scrollTop=9999}
function mic(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR)return alert('Open in Chrome');let r=new SR();r.lang=lang=='ar'?'ar-SA':lang=='en'?'en-US':'ur-PK';r.start();mc.innerText='🔴';r.onresult=e=>i.value=e.results[0][0].transcript;r.onend=()=>mc.innerText='🎤'}
in.addEventListener('keydown',e=>{if(e.key==='Enter')s()});
</script></body></html>
