<!DOCTYPE html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>Lucky AI</title><style>body{margin:0;height:100dvh;display:flex;flex-direction:column;font-family:system-ui;background:#f8fafc}#C{flex:1;overflow:auto;padding:10px;display:flex;flex-direction:column;gap:8px}.m{padding:10px 13px;border-radius:14px;max-width:85%;font-size:15px;white-space:pre-wrap;word-break:break-word}.u{background:#22c55e;align-self:flex-end;color:#fff}.a{background:#fff;align-self:flex-start;box-shadow:0 1px 3px #0002}.B{position:sticky;bottom:0;display:flex;gap:6px;padding:8px;background:#1e293b;align-items:center}#I{flex:1;padding:12px;border-radius:22px;border:0;outline:0}button{width:40px;height:40px;border-radius:50%;border:0;background:#334155;color:#fff;font-size:18px}#S{background:#22c55e}img{max-width:100%;border-radius:12px;margin-top:8px}</style><div id=C><div class="m a">السلام علیکم بھائی جان! 🍀

اردو / English + تصویر بھی بناؤں گا</div></div><div class=B><button onclick=G.click()>🖼️</button><button onclick=V()>🎤</button><input id=I placeholder="کچھ بھی پوچھو..."><button id=S onclick=SD()>➤</button></div><input id=G type=file accept="image/*" hidden><script>function AD(t,k){let X=document.getElementById('C'),d=document.createElement('div');d.className='m '+k;d.innerHTML=t;X.appendChild(d);X.scrollTop=9e9;return d}
async function SD(){let i=document.getElementById('I'),q=i.value.trim();if(!q)return;AD(q,'u');i.value='';
let l=q.toLowerCase(),isImg=l.includes('تصویر')||l.includes('tasveer')||l.includes('image')||l.includes('photo')||l.includes('picture')||l.includes('banao')||l.includes('بناؤ');
if(isImg){let m=AD('تصویر بنا رہا ہوں بھائی... 🎨','a');let u='https://image.pollinations.ai/prompt/'+encodeURIComponent(q)+'?width=512&height=512&nologo=1&seed='+Date.now();m.innerHTML+='<br><img src="'+u+'" onload="this.scrollIntoView()" onerror="this.outerHTML=`<br>نیٹ سلو ہے دوبارہ لکھو`">';return}
let m=AD('سوچ رہا ہوں بھائی...','a');
try{
// نیا اور تیز سرور
let r=await fetch('https://api.pollinations.ai/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'openai',messages:[{role:'user',content:q}],stream:false})});
let j=await r.json();let ans=j.choices?.[0]?.message?.content||'';
if(ans){m.textContent=ans;return}throw 1;
}catch(e){
try{let r2=await fetch('https://text.pollinations.ai/'+encodeURIComponent(q)+'?model=openai');let t2=await r2.text();if(t2&&t2!='{}'&&t2.length>3){m.textContent=t2;return}}catch{}
m.textContent='بھائی نیٹ تھوڑا سلو ہے، 10 سیکنڈ بعد دوبارہ لکھیں، اب صحیح جواب آئے گا انشاءاللہ';
}}
function V(){let R=window.SpeechRecognition||window.webkitSpeechRecognition;if(!R)return alert('اس موبائل میں مائک نہیں ہے');let r=new R();r.lang='ur-PK';r.start();AD('سن رہا ہوں... 🎤 بولو بھائی','a');r.onresult=e=>{document.getElementById('I').value=e.results[0][0].transcript;SD()}}
I.onkeydown=e=>{if(e.key=='Enter')SD()};
G.onchange=e=>{if(e.target.files[0])AD('تصویر بھیجی: '+e.target.files[0].name+' ماشاءاللہ پیاری ہے!','u')}
</script>
