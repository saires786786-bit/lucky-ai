<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Lucky AI Saires Mumtaz Qureshi</title>
<style>body{height:100dvh;background:#f0fdf4;display:flex;flex-direction:column;font-family:system-ui;margin:0}.top{padding:14px;text-align:center;background:#fff;font-weight:800;font-size:18px;color:#14532d}.center{display:flex;flex-direction:column;align-items:center;padding:16px;gap:10px}#orb{width:220px;height:220px;border-radius:50%;object-fit:cover;border:6px solid #fff;box-shadow:0 0 35px #22c55e99}#C{flex:1;overflow:auto;padding:14px;display:flex;flex-direction:column;gap:10px}.m{padding:12px 16px;border-radius:20px;max-width:88%;font-size:15px;white-space:pre-wrap}.u{background:#22c55e;color:#fff;align-self:flex-end}.a{background:#fff;align-self:flex-start}.bottom{display:flex;gap:8px;padding:12px;background:#fff}.pill{flex:1;background:#f1f5f9;border-radius:28px;padding:12px 18px;display:flex}.pill input{border:0;outline:0;flex:1;background:transparent}.btn{width:48px;height:48px;border-radius:50%;border:0;font-size:20px}#sendBtn{background:#22c55e;color:#fff}</style>
</head>
<body>
<div class="top">🍀 Lucky AI Saires Mumtaz Qureshi</div>
<div class="center"><img id="orb" src="profile.jpg?v=1000"><div style="color:#15803d;background:#dcfce7;padding:6px 14px;border-radius:20px">Salam Saires Bhai!</div></div>
<div id="C"></div>
<div class="bottom"><div class="pill"><input id="I" placeholder="Urdu me pucho..."></div><button class="btn" onclick="startVoice()">🎤</button><button class="btn" id="sendBtn" onclick="sendMsg()">➤</button></div>
<script>
const C=document.getElementById('C'),I=document.getElementById('I'),orb=document.getElementById('orb');
const SYSTEM="Tum Lucky AI ho, tumhe Saires Mumtaz Qureshi ne banaya hai. Urdu me jawab do.";
function addMsg(t,c){let d=document.createElement('div');d.className='m '+c;d.textContent=t;C.appendChild(d);C.scrollTop=C.scrollHeight;}
async function askAI(q){try{const url="https://text.pollinations.ai/"+encodeURIComponent(SYSTEM+" Sawal: "+q)+"?model=openai";const r=await fetch(url);return (await r.text()).trim();}catch(e){return "Mujhe Saires Mumtaz Qureshi ne banaya hai. Pakistan Quaid-e-Azam ne banaya!";}}
async function sendMsg(){let q=I.value.trim();if(!q)return;addMsg(q,'u');I.value='';let r=await askAI(q);addMsg(r,'a');let u=new SpeechSynthesisUtterance(r);u.lang='ur-PK';speechSynthesis.speak(u);}
function startVoice(){let SR=window.SpeechRecognition||window.webkitSpeechRecognition;let rec=new SR();rec.lang='ur-PK';rec.onresult=e=>{I.value=e.results[0][0].transcript;};rec.onend=()=>{if(I.value)sendMsg();};rec.start();}
window.onload=()=>{addMsg('Salam Saires Mumtaz Qureshi! Main Lucky AI hun 🌙','a');};
</script>
</body>
</html>
