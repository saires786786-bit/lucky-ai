<!DOCTYPE html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Lucky AI</title><style>*{box-sizing:border-box;margin:0}body{height:100dvh;display:flex;flex-direction:column;background:#efe7dd;font-family:system-ui}#h{padding:14px;background:#075e54;color:#fff;text-align:center;font-weight:bold}#C{flex:1;overflow:auto;padding:12px 12px 90px;display:flex;flex-direction:column;gap:8px}.m{padding:10px 14px;border-radius:18px;max-width:85%;white-space:pre-wrap;line-height:1.5;font-size:14px}.u{background:#dcf8c6;align-self:flex-end}.a{background:#fff;align-self:flex-start;border:1px solid #eee}.B{position:fixed;bottom:0;left:0;right:0;background:#f0f0f0;padding:8px;display:flex;gap:6px}.pill{flex:1;background:#fff;border-radius:28px;display:flex;align-items:center;padding:5px 10px}.pill input{flex:1;border:0;outline:0;padding:8px;font-size:15px}.icon{font-size:20px;cursor:pointer;margin-right:6px}#S{width:44px;height:44px;border-radius:50%;border:0;background:#25d366;color:#fff;font-size:20px;cursor:pointer}</style></head><body><div id="h">🍀 Lucky AI - Saires Mumtaz Qureshi</div><div id="C"></div><div class="B"><div class="pill"><span class="icon" onclick="cam.click()">📷</span><span class="icon" onclick="gal.click()">🖼️</span><input id="I" placeholder="Koi bhi sawal pucho..."></div><button id="S">➤</button></div><input type="file" id="cam" accept="image/*" capture="environment" style="display:none"><input type="file" id="gal" accept="image/*" style="display:none"><script>
let C=document.getElementById('C'),I=document.getElementById('I'),S=document.getElementById('S'),cam=document.getElementById('cam'),gal=document.getElementById('gal');
function AD(t,k){let d=document.createElement('div');d.className='m '+k;d.textContent=t;C.appendChild(d);C.scrollTop=C.scrollHeight;return d}
cam.onchange=()=>{let f=cam.files[0];if(f){let r=new FileReader();r.onload=e=>{let d=document.createElement('div');d.className='m u';d.innerHTML=`<img src="${e.target.result}" style="max-width:220px;border-radius:12px">`;C.appendChild(d);AD('Tasveer mil gayi bhai! Batao iska kya karna hai?','a')};r.readAsDataURL(f)}};
gal.onchange=cam.onchange;
async function ask(q){
const systemPrompt=`You are Lucky AI, created by Saires Mumtaz Qureshi. You are a super intelligent AI like Meta AI.
- You know EVERYTHING: Islam, Pakistan history, Quaid-e-Azam = Muhammad Ali Jinnah (founder of Pakistan), Allama Iqbal = Dr. Muhammad Iqbal (poet, gave idea of Pakistan), Science, Math, Coding, English, Urdu, everything.
- You NEVER say "I don't know". You always give correct, detailed answer.
- Answer in Roman Urdu (Urdu written in English letters), simple and clear.
- Be friendly, like a brother.
- If user asks who made you, say Saires Mumtaz Qureshi ne banaya hai.
- Never say you are OpenAI or ChatGPT. You are Lucky AI.`;
try{
let res=await fetch('https://text.pollinations.ai/openai',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({model:'openai',messages:[{role:'system',content:systemPrompt},{role:'user',content:q}],temperature:0.3})});
let data=await res.json();
return data.choices[0].message.content;
}catch(e){return "Bhai thora net slow hai, dubara pucho!";}
}
async function SD(){let q=I.value.trim();if(!q)return;AD(q,'u');I.value='';let m=AD('Soch raha hoon...','a');let ans=await ask(q);m.textContent=ans.replace(/OpenAI|ChatGPT|Pollinations/gi,'Lucky AI');}
S.onclick=SD;I.onkeydown=e=>{if(e.key==='Enter')SD()};
</script></body></html>
